<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול · הלכה בבית</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
main{max-width:52rem}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1 1 9rem;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-family:var(--display);font-size:2rem;color:var(--accent);line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.users{display:grid;gap:14px}
.user{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.user.pending{border-color:var(--accent);background:var(--soft)}
.u-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.u-head h3{margin:0;font-size:1.15rem}
.u-head small{color:var(--muted);display:block}
.meta{color:var(--muted);font-size:.9rem;text-align:left}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 6px 3px 12px;font-size:.9rem}
.chip button{padding:0 7px;border-radius:999px;font-size:.8rem}
.none{color:var(--muted);font-size:.9rem}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.prog{display:grid;gap:6px;font-size:.92rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
table.q{width:100%;border-collapse:collapse;font-size:.9rem}
table.q th,table.q td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
table.q th{color:var(--muted);font-weight:600}
details summary{cursor:pointer;color:var(--accent)}
.note{margin:0;font-size:.95rem;background:var(--soft);border-radius:10px;padding:8px 12px}
.tag{font-size:.75rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;vertical-align:middle}
.u-head small a{color:inherit}
.form.invite{max-width:none}
.add .close{border-color:#b4473a;color:#b4473a;background:none}
.chip.plain{padding:3px 12px}
.chip.gch{padding:3px 12px;background:none;cursor:pointer;font:inherit;font-size:.9rem}
.chip.gch:hover{background:var(--soft)}
.chip.gch.off{border-color:var(--line);color:var(--muted)}
.gmenu .gm{display:grid;gap:8px;margin-top:12px}
.gmenu .gm > button{text-align:start}
.gmenu .gm > button.close{border-color:#b4473a;color:#b4473a;background:none}
.gmenu .gm > button.on{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:600}
.gmenu .when{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.gmenu .when .add{margin:4px 0 0}
.gmenu input[type=datetime-local]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.help{color:var(--muted);font-size:.92rem;margin:-4px 0 14px}
.help .g{color:var(--accent)}.help .r{color:#b4473a}
.pick{display:flex;gap:8px;align-items:flex-start}
.pick input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.user.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.selbar{position:fixed;inset:auto 0 64px 0;z-index:31;display:flex;justify-content:center;pointer-events:none}
.selbar div{pointer-events:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--bg);border:1px solid var(--accent);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 6px 20px rgb(0 0 0/.18)}
dialog.bulk{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);padding:18px 20px;width:min(30rem,calc(100vw - 32px));max-height:85vh;overflow:auto}
dialog.bulk::backdrop{background:rgb(0 0 0/.45)}
.bulk h3{margin:0 0 4px}.bulk .rowp{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.bulk .opts{display:flex;gap:6px;flex-wrap:wrap}
.bulk .opts label{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.9rem;cursor:pointer}
.bulk .opts label:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:600}
.bulk .opts input{margin:0}
.bulk .acts{margin-top:14px}
body:has(.selbar:not([hidden])) main{padding-bottom:150px}
.rounds{margin-top:10px}.rounds h4{margin:0 0 4px;font-size:.95rem}
.round{border-top:1px solid var(--line);padding:6px 0;font-size:.92rem}.round.empty{color:var(--muted)}
.rsec{padding:8px 0;border-bottom:1px dashed var(--line)}
.ans{margin:6px 0 0;padding-inline-start:1.2em;display:grid;gap:6px}.ans li.ok{color:var(--fg)}.ans li.bad{color:#b3261e}.ans small{color:var(--muted)}
</style>
</head><body>
<main dir="rtl" lang="he">
  <header>
    <a class="back" href="/">→ חזרה לדף הבית</a>
    <h1>ניהול</h1>
    <p class="lead">מי נרשם, מה למד, מה הציונים, ומה פתוח לכל אחד. · <a href="/admin/versions/">יומן גרסאות</a> · <a href="/halacha/harchakot/?proof">הרחקות: דף הגהה</a></p>
  </header>
  <section id="app"><p class="msg">טוען…</p></section>
  <footer>
    <span>רק אתה רואה את הדף הזה.</span>
    <button id="theme" type="button">מצב כהה</button>
  </footer>
</main>
<script src="/site.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/auth.js"></script>
<script>
(async function(){
  var app=document.getElementById('app'), sb=SITE.sb;
  var CHAPTERS={harchakot:{title:'הרחקות',total:26},'leil-hachatuna':{title:'סדר ליל החתונה',total:15,own:true,heads:["כניסה לבית", "חופת נדה", "חופה טהורה", "סידור החדר", "כדי להימנע מאי נעימות ומכאב", "דברי אהבה וריצוי", "הביאה", "בשעת התשמיש", "בכלה בתולה", "טומאת בתולים", "לאחר שעברו את טומאת בתולים", "התארגנות שאחרי", "לבעול בזמן המוקדם האפשרי", "קשר עם המדריך/כה", "ומה עוד לגבי המשך החיים?"]}};
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
  function when(t){if(!t)return'—';var d=new Date(t);return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}
  function title(path){var n=SITE.TREE.find(function(x){return x.path===path});return n?n.title:path}
  function depth(path){return path.split('/').length-1}
  var st=await SITE.ready;
  if(!st.user){app.innerHTML='<p>צריך <a href="/login/?next=/admin/">להיכנס</a> קודם.</p>';return}
  if(!(st.profile&&st.profile.is_admin)){app.innerHTML='<p class="msg">הדף הזה פתוח רק למנהל.</p>';return}

  var QUIZ=null, RESETS=[];
  async function load(){
    var r=await Promise.all([
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('grants').select('*'),
      sb.from('reads').select('*'),
      sb.from('quiz_results').select('*').order('taken_at',{ascending:false}),
      sb.from('invites').select('*').order('created_at',{ascending:false}),
      sb.from('access_requests').select('*').is('handled_at',null).order('created_at'),
      sb.from('quiz_resets').select('*').order('reset_at'),  // from supabase/v8.sql; empty until it runs
      QUIZ?null:fetch('/halacha/harchakot/quiz.json').then(function(x){return x.json()}).then(function(d){QUIZ={harchakot:d}}).catch(function(){QUIZ={}})
    ]);
    RESETS=r[6].error?[]:r[6].data;
    var err=r.slice(0,4).find(function(x){return x.error});
    if(err){app.innerHTML='<p class="msg err">שגיאה בטעינה: '+esc(err.error.message)+'</p>';return}
    render(r[0].data,r[1].data,r[2].data,r[3].data,r[4].error?null:r[4].data,r[5].error?null:r[5].data);
  }

  // Quiz rounds: every reset of a chapter's quiz starts a new row. Each row opens to the answers, section by section.
  function rounds(u,uq){
    var out='';
    Object.keys(CHAPTERS).forEach(function(c){
      var cq=uq.filter(function(x){return x.chapter===c}).slice().sort(function(a,b){return a.taken_at<b.taken_at?-1:1});
      var cuts=RESETS.filter(function(z){return z.user_id===u.id&&z.chapter===c}).map(function(z){return z.reset_at});
      if(!cq.length&&!cuts.length)return;
      var starts=[null].concat(cuts), qd=(QUIZ||{})[c]||{};
      var rows=starts.map(function(from,k){
        var to=starts[k+1], last={};
        cq.forEach(function(x){if((!from||x.taken_at>from)&&(!to||x.taken_at<=to))last[x.section]=x});
        var list=Object.keys(last).sort(function(a,b){return a-b}).map(function(n){return last[n]});
        var s=0,t=0;list.forEach(function(x){s+=x.score;t+=x.total});
        var hd='סבב '+(k+1)+(from?' · מ־'+when(from):'')+' · '+list.length+' קטעים, '+t+' שאלות'+(t?' · ציון '+Math.round(100*s/t)+'%':'')+(to?'':' (נוכחי)');
        if(!list.length)return '<div class="round empty">'+esc(hd)+' · עוד לא ענה</div>';
        return '<details class="round"><summary>'+esc(hd)+'</summary>'+list.map(function(x){
          var qs=qd[x.section]||[];
          var ans=x.answers?'<ol class="ans">'+qs.map(function(q,i){var j=x.answers[i], ok=j===q.c;
            return '<li class="'+(ok?'ok':'bad')+'">'+(ok?'✓ ':'✗ ')+esc(q.q)+'<br><small>ענה: '+esc(j==null?'—':q.a[j])+(ok?'':' · הנכונה: '+esc(q.a[q.c]))+'</small></li>'}).join('')+'</ol>'
            :'<p class="none">התשובות עצמן לא נשמרו (לפני שהתחלנו לשמור אותן).</p>';
          return '<div class="rsec"><b>קטע '+x.section+'</b> · '+x.score+'/'+x.total+' · '+when(x.taken_at)+ans+'</div>';
        }).join('')+'</details>';
      });
      out+='<div class="rounds"><h4>שאלונים · '+esc(CHAPTERS[c].title)+'</h4>'+rows.join('')+'</div>';
    });
    return out;
  }

  function render(users,grants,reads,results,invites,requests){
    var others=users.filter(function(u){return !u.is_admin});
    var pending=others.filter(function(u){return !grants.some(function(g){return g.user_id===u.id&&!isOwn(g.path)})});
    var week=Date.now()-7*864e5;
    var active=others.filter(function(u){return u.last_seen&&new Date(u.last_seen)>week});
    var h='<div class="stats">'+
      '<div class="stat"><b>'+others.length+'</b><span>משתמשים רשומים</span></div>'+
      '<div class="stat"><b>'+pending.length+'</b><span>ממתינים לאישור</span></div>'+
      '<div class="stat"><b>'+active.length+'</b><span>נכנסו השבוע</span></div>'+
      '<div class="stat"><b>'+results.filter(function(x){return others.some(function(u){return u.id===x.user_id})}).length+'</b><span>בחינות שנעשו</span></div></div>';
    // Adding a student lives at the bottom; up here only a button that scrolls down to it.
    h+='<div class="add" style="margin-top:16px"><button type="button" class="primary" data-goinv>+ הוספת תלמיד</button></div>';
    h+=requestBlock(requests,users);
    h+='<h2 style="margin-top:32px">משתמשים</h2><p class="help">לכל תלמיד יש כפתור אחד. <b class="g">אישור</b> (ירוק) פותח לו את מה שבחרת ברשימות שלידו. <b class="r">סגירה</b> (אדומה) חוסמת לו את כל הגישה, ואפשר לפתוח שוב באישור. שום כפתור כאן לא מוחק תלמיד, הוא והציונים שלו נשמרים תמיד.</p>';
    if(!others.length)h+='<p class="none">עוד אין משתמשים רשומים. כשמישהו יירשם דרך "כניסה / הרשמה", הוא יופיע כאן.</p>';
    if(others.length)h+='<p class="help">כדי לקבוע הרשאות לכמה תלמידים ביחד: סמן אותם בתיבה שליד השם, ולחץ <b class="g">הרשאות</b> בחלונית שתופיע למטה. · <button type="button" class="link" data-selall>בחירת כולם</button></p>';
    h+='<div class="users">';
    others.sort(function(a,b){return (pending.indexOf(b)>-1)-(pending.indexOf(a)>-1)});
    others.forEach(function(u){
      var all=grants.filter(function(g){return g.user_id===u.id}), ug=all.filter(function(g){return !isOwn(g.path)});
      var ur=reads.filter(function(x){return x.user_id===u.id});
      var uq=results.filter(function(x){return x.user_id===u.id});
      h+='<article class="user'+(ug.length?'':' pending')+(sel.has(u.id)?' sel':'')+'" data-u="'+u.id+'">'+
        '<div class="u-head"><label class="pick"><input type="checkbox" data-sel="'+u.id+'"'+(sel.has(u.id)?' checked':'')+' aria-label="בחירה"><div><h3>'+esc(uname(u))+(u.invited?' <span class="tag">נוסף ע״י המנהל</span>':'')+(u.must_change_pw?' <span class="tag">עוד לא נכנס</span>':'')+'</h3><small dir="ltr">'+esc(u.email)+'</small>'+
        (u.phone?'<small dir="ltr"><a href="tel:'+esc(u.phone)+'">'+esc(u.phone)+'</a></small>':'')+'</div></label>'+
        '<div class="meta">נרשם: '+when(u.created_at)+'<br>כניסה אחרונה: '+when(u.last_seen)+'</div></div>';
      if(u.note)h+='<p class="note">הערה: '+esc(u.note)+'</p>';
      // Each permission is a button: it opens a menu to change, close or schedule it.
      h+='<div class="chips"><span class="none">גישה:</span>'+(ug.length?ug.map(gchip).join(''):'<span class="none">סגור (ממתין לאישור)</span>')+
        all.filter(function(g){return isOwn(g.path)}).map(gchip).join('')+'</div>';
      // Chapters with their own permission: open for a week from here too, without waiting for a request.
      h+=SITE.TREE.filter(function(n){return n.own}).map(function(n){var g=all.find(function(x){return x.path===n.path&&SITE.live(x)});
        return '<div class="add"><button type="button" data-week="'+n.path+'">'+(g?'הארכה':'פתיחה')+' של '+esc(n.title)+' ל־'+n.days+' ימים</button></div>'}).join('');
      // One button: approve (with the chosen access) when closed, close (remove all access) when open.
      h+='<div class="add">'+(ug.length?'':'<select data-path>'+opts()+'</select><select data-mode><option value="study">קריאה + שאלון</option><option value="read">קריאה בלבד</option></select>')+
        '<button type="button" class="'+(ug.length?'close':'primary')+'" data-toggle="'+(ug.length?'close':'open')+'" title="'+(ug.length?'חסימת כל הגישה של התלמיד (אפשר לפתוח שוב)':'פתיחת הגישה שבחרת ברשימות')+'">'+(ug.length?'סגירה':'אישור')+'</button>'+
        '<span class="none">'+(ug.length?'סגירה חוסמת לו את כל הגישה':'בחר מה לפתוח ולחץ אישור')+'</span></div>';
      Object.keys(CHAPTERS).forEach(function(c){
        var n=ur.filter(function(x){return x.chapter===c}).length, cq=uq.filter(function(x){return x.chapter===c});
        var pct=cq.length?Math.round(100*cq.reduce(function(s,x){return s+x.score},0)/cq.reduce(function(s,x){return s+x.total},0)):null;
        if(CHAPTERS[c].own&&!n&&!all.some(function(g){return g.path===c}))return;
        h+='<div class="prog"><div>'+esc(CHAPTERS[c].title)+': קרא '+n+' מתוך '+CHAPTERS[c].total+' קטעים'+(cq.length?' · '+cq.length+' בחינות, ממוצע '+pct+'%':'')+'</div><div class="bar"><i style="width:'+(100*n/CHAPTERS[c].total)+'%"></i></div></div>';
        // Which headings were read (chapters whose reading is tracked quietly).
        if(CHAPTERS[c].heads){var got=ur.filter(function(x){return x.chapter===c}).map(function(x){return x.section});
          h+='<details><summary>קריאה לפי כותרות</summary><ol class="none" style="margin:6px 0 0">'+CHAPTERS[c].heads.map(function(t,i){var r=ur.find(function(x){return x.chapter===c&&x.section===i+1});
            return '<li>'+(r?'✓ ':'○ ')+esc(t)+(r?' · '+when(r.read_at):'')+'</li>'}).join('')+'</ol></details>'}
      });
      h+=rounds(u,uq);
      h+='</article>';
    });
    app.innerHTML=h+'</div>'+inviteBlock(invites);
    window.__users=others;window.__grants=grants;
    sel.forEach(function(id){if(!others.some(function(u){return u.id===id}))sel.delete(id)});
    selBar();
  }

  // Several students at once: tick them, then set their permissions in one floating window.
  var sel=new Set(), bar=document.createElement('div');bar.className='selbar';bar.hidden=true;document.body.appendChild(bar);
  function selBar(){
    bar.hidden=!sel.size;
    bar.innerHTML='<div><span>נבחרו '+sel.size+'</span><button type="button" class="primary" data-bulk>הרשאות</button><button type="button" data-unsel>ביטול הבחירה</button></div>';
  }
  bar.addEventListener('click',function(e){
    if(e.target.closest('[data-unsel]')){sel.clear();document.querySelectorAll('[data-sel]').forEach(function(c){c.checked=false;c.closest('.user').classList.remove('sel')});selBar()}
    if(e.target.closest('[data-bulk]'))bulk();
  });
  app.addEventListener('change',function(e){
    var c=e.target.closest('[data-sel]');if(!c)return;
    if(c.checked)sel.add(c.getAttribute('data-sel'));else sel.delete(c.getAttribute('data-sel'));
    c.closest('.user').classList.toggle('sel',c.checked);selBar();
  });

  // Permission levels: 'study' = reading + quiz, 'read' = reading only ('quiz' = quiz only, from before).
  function modeName(m){return m==='study'?'קריאה + שאלון':m==='read'?'קריאה בלבד':'רק שאלון'}
  function bulk(){
    var users=(window.__users||[]).filter(function(u){return sel.has(u.id)});
    var d=document.createElement('dialog');d.className='bulk';
    var h='<h3>הרשאות ל־'+users.length+' תלמידים</h3><p class="none">'+esc(users.map(uname).join(', '))+'</p>';
    h+='<p class="help" style="margin:8px 0 0">מה שמסומן "בלי שינוי" נשאר לכל אחד כמו שהוא היה.</p>';
    SITE.TREE.forEach(function(n,i){
      var o=n.own?[['keep','בלי שינוי'],['week','פתיחה ל־'+n.days+' ימים'],['off','סגירה']]
                 :[['keep','בלי שינוי'],['study','קריאה + שאלון'],['read','קריאה בלבד'],['off','סגירה']];
      h+='<div class="rowp"><b>'+'\u00a0\u00a0'.repeat(n.own?0:depth(n.path))+esc(n.title)+'</b><div class="opts">'+
        o.map(function(x,j){return '<label><input type="radio" name="p'+i+'" value="'+x[0]+'"'+(j?'':' checked')+'>'+x[1]+'</label>'}).join('')+'</div></div>';
    });
    h+='<div class="add acts"><button type="button" class="primary" data-apply>שמירה</button><button type="button" data-x>ביטול</button></div><p class="msg" role="status"></p>';
    d.innerHTML=h;document.body.appendChild(d);
    d.addEventListener('close',function(){d.remove()});
    d.addEventListener('click',async function(e){
      if(e.target===d||e.target.closest('[data-x]')){d.close();return}
      var ap=e.target.closest('[data-apply]');if(!ap)return;
      var ids=users.map(function(u){return u.id}), ups=[], dels=[];
      SITE.TREE.forEach(function(n,i){
        var v=d.querySelector('input[name="p'+i+'"]:checked').value;
        if(v==='keep')return;
        if(v==='off'){dels.push(n.path);return}
        ids.forEach(function(id){ups.push(n.own?{user_id:id,path:n.path,mode:'study',expires_at:new Date(Date.now()+n.days*864e5).toISOString()}:{user_id:id,path:n.path,mode:v})});
      });
      if(!ups.length&&!dels.length){d.close();return}
      ap.disabled=true;var m=d.querySelector('.msg'),err=null;
      if(dels.length){var r=await sb.from('grants').delete().in('user_id',ids).in('path',dels);err=r.error}
      if(!err&&ups.length){var r2=await sb.from('grants').upsert(ups,{onConflict:'user_id,path'});err=r2.error}
      // Opening a time-limited chapter also answers the students' waiting requests for it.
      SITE.TREE.forEach(function(n,i){
        if(!err&&n.own&&d.querySelector('input[name="p'+i+'"]:checked').value==='week')
          sb.from('access_requests').update({handled_at:new Date().toISOString(),approved:true}).in('user_id',ids).eq('path',n.path).is('handled_at',null).then(function(){});
      });
      if(err){m.classList.add('err');m.textContent=/expires_at/.test(err.message)?'צריך קודם להריץ ב־Supabase את supabase/v4.sql.':err.message;ap.disabled=false;return}
      d.close();sel.clear();load();
    });
    d.showModal();
  }

  function uname(u){return (u.first_name||u.last_name?[u.first_name,u.last_name].filter(Boolean).join(' '):u.full_name)||'(ללא שם)'}
  function isOwn(path){return SITE.TREE.some(function(n){return n.path===path&&n.own})}
  function day(t){return t?new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'long'}):''}
  function dt(t){return t?new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'long'})+' '+new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):''}
  // Short status of one permission: its level, and when it opens or closes.
  function gstate(g){
    var now=new Date(), parts=[isOwn(g.path)?'קריאה':modeName(g.mode)];
    if(g.starts_at&&new Date(g.starts_at)>now)parts.push('ייפתח '+dt(g.starts_at));
    if(g.expires_at)parts.push(new Date(g.expires_at)>now?'עד '+dt(g.expires_at):'הסתיים '+day(g.expires_at));
    return parts.join(' · ');
  }
  function gchip(g){
    var off=!SITE.live(g);
    return '<button type="button" class="chip gch'+(off?' off':'')+'" data-gid="'+g.id+'">'+esc(title(g.path))+' · '+esc(gstate(g))+' <span aria-hidden="true">▾</span></button>';
  }
  // For <input type="datetime-local">: local time, without seconds.
  function local(t){var d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
  // The menu of one permission: level, close, scheduled opening, scheduled closing.
  function gmenu(g,name){
    var own=isOwn(g.path), n=SITE.TREE.find(function(x){return x.path===g.path})||{days:7};
    var d=document.createElement('dialog');d.className='bulk gmenu';
    var h='<h3>'+esc(title(g.path))+'</h3><p class="none">'+esc(name)+' · '+esc(gstate(g))+'</p><div class="gm">';
    if(own)h+='<button type="button" data-act="week">פתיחה ל־'+n.days+' ימים מעכשיו</button>';
    else h+=[['read','קריאה בלבד'],['study','קריאה + שאלון']].map(function(m){return '<button type="button" data-act="mode" data-v="'+m[0]+'"'+(g.mode===m[0]?' class="on"':'')+'>'+(g.mode===m[0]?'✓ ':'')+m[1]+'</button>'}).join('');
    h+='<button type="button" class="close" data-act="del">סגירה</button>';
    [['starts_at','תזמון מועד פתיחה','עד המועד הזה הגישה סגורה, ואז נפתחת מעצמה.'],['expires_at','תזמון מועד סגירה','במועד הזה הגישה נסגרת מעצמה.']].forEach(function(f){
      h+='<div class="when"><b>'+f[1]+'</b><small class="none">'+f[2]+'</small><div class="add"><input type="datetime-local" data-f="'+f[0]+'" value="'+(g[f[0]]?local(g[f[0]]):'')+'">'+
        '<button type="button" class="primary" data-act="set" data-f="'+f[0]+'">שמירה</button>'+(g[f[0]]?'<button type="button" data-act="clear" data-f="'+f[0]+'">בלי תזמון</button>':'')+'</div></div>';
    });
    h+='</div><div class="add acts"><button type="button" data-x>סגירת החלון</button></div><p class="msg" role="status"></p>';
    d.innerHTML=h;document.body.appendChild(d);
    d.addEventListener('close',function(){d.remove()});
    d.addEventListener('click',async function(e){
      if(e.target===d||e.target.closest('[data-x]')){d.close();return}
      var b=e.target.closest('[data-act]');if(!b)return;
      var act=b.getAttribute('data-act'), f=b.getAttribute('data-f'), m=d.querySelector('.msg'), r;
      if(act==='del'&&!confirm('לסגור ל'+name+' את "'+title(g.path)+'"?'))return;
      if(act==='set'){var v=d.querySelector('input[data-f="'+f+'"]').value;if(!v){m.textContent='צריך לבחור תאריך ושעה.';return}}
      b.disabled=true;
      if(act==='mode')r=await sb.from('grants').update({mode:b.getAttribute('data-v')}).eq('id',g.id);
      else if(act==='week'){var wk={expires_at:new Date(Date.now()+n.days*864e5).toISOString()};if(g.starts_at)wk.starts_at=null;r=await sb.from('grants').update(wk).eq('id',g.id)}
      else if(act==='del')r=await sb.from('grants').delete().eq('id',g.id);
      else{var up={};up[f]=act==='set'?new Date(v).toISOString():null;r=await sb.from('grants').update(up).eq('id',g.id)}
      if(r.error){b.disabled=false;m.classList.add('err');
        m.textContent=/starts_at/.test(r.error.message)?'צריך קודם להריץ ב־Supabase את supabase/v7.sql.':/mode_check/.test(r.error.message)?'צריך קודם להריץ ב־Supabase את supabase/v7.sql.':r.error.message;return}
      d.close();load();
    });
    d.showModal();
  }
  // Opens a time-limited chapter for its number of days, counted from now.
  function openFor(uid,path){
    var n=SITE.TREE.find(function(x){return x.path===path});
    return sb.from('grants').upsert({user_id:uid,path:path,mode:'study',expires_at:new Date(Date.now()+n.days*864e5).toISOString()},{onConflict:'user_id,path'});
  }

  // Requests from students for chapters that need their own permission.
  function requestBlock(requests,users){
    if(requests===null)return '<p class="msg" style="margin-top:24px">כדי לקבל בקשות גישה (סדר ליל החתונה), צריך להריץ קודם את supabase/v4.sql.</p>';
    var h='<h2 style="margin-top:32px">בקשות גישה'+(requests.length?' ('+requests.length+')':'')+'</h2>';
    if(!requests.length)return h+'<p class="none">אין בקשות שממתינות.</p>';
    h+='<p class="help"><b class="g">אישור</b> פותח את הפרק לתלמיד לשבוע מהיום, ואחר כך הוא נסגר מעצמו. <b class="r">דחייה</b> סוגרת את הבקשה, והתלמיד יכול לבקש שוב.</p><div class="users">';
    return h+requests.map(function(q){var u=users.find(function(x){return x.id===q.user_id})||{};
      return '<article class="user pending"><div class="u-head"><div><h3>'+esc(uname(u))+'</h3><small dir="ltr">'+esc(u.email)+'</small></div><div class="meta">ביקש: '+esc(title(q.path))+'<br>'+when(q.created_at)+'</div></div>'+
        '<div class="add"><button type="button" class="primary" data-rq="'+q.id+'" data-ok="1">אישור לשבוע</button><button type="button" class="close" data-rq="'+q.id+'">דחייה</button></div></article>'}).join('')+'</div>';
  }

  function opts(){return SITE.TREE.filter(function(n){return !n.own}).map(function(n){return '<option value="'+n.path+'">'+'\u00a0\u00a0'.repeat(depth(n.path))+esc(n.title)+'</option>'}).join('')}

  // Pre-registration: whoever signs up later with this email gets the access right away.
  function inviteBlock(invites){
    if(invites===null)return '<p class="msg" style="margin-top:24px">כדי להוסיף אנשים מראש, צריך להריץ קודם את supabase/v2.sql.</p>';
    var open=invites.filter(function(i){return !i.used_at});window.__invites=open;
    var h='<h2 style="margin-top:40px;scroll-margin-top:16px" id="addst">הוספת תלמיד</h2><form class="form invite" id="inv">'+
      '<label>הדבקה מהירה (לא חובה)<textarea name="paste" rows="2" placeholder="שם: ...; משפחה: ...; טלפון: ...; אימייל: ..."></textarea></label>'+
      '<div class="row"><label>שם פרטי<input name="first" required></label><label>שם משפחה<input name="last"></label></div>'+
      '<div class="row"><label>מייל<input name="email" type="email" required dir="ltr"></label><label>טלפון<input name="phone" type="tel" dir="ltr"></label></div>'+
      '<div class="row"><label>הערה<input name="note"></label><label>סיסמה זמנית<input name="pw" value="123456" required minlength="6" dir="ltr"></label></div>'+
      '<div class="row"><label>מה נפתח לו<select name="path">'+opts()+'</select></label><label>סוג<select name="mode"><option value="study">קריאה + שאלון</option><option value="read">קריאה בלבד</option></select></label></div>'+
      '<button class="primary" type="submit">הוספה</button><p class="none">התלמיד נכנס עם המייל והסיסמה הזמנית, ובכניסה הראשונה חייב לבחור סיסמה חדשה. הגישה שבחרת פתוחה לו מיד.</p><p class="msg" id="invmsg" role="status"></p></form>';
    if(open.length){
      h+='<h3 style="margin-top:20px">הוזמנו ועוד לא נרשמו ('+open.length+')</h3><p class="help">הגישה שלהם כבר מאושרת (בעמודה "גישה") ותיפתח ברגע שיירשמו. <b class="g">פתיחת חשבון</b> יוצר להם חשבון כבר עכשיו עם סיסמה זמנית 123456. <b class="r">ביטול הזמנה</b> מבטל את האישור.</p><table class="q"><thead><tr><th>שם</th><th>מייל</th><th>גישה</th><th></th></tr></thead><tbody>'+
        open.map(function(i){return '<tr><td>'+esc([i.first_name,i.last_name].filter(Boolean).join(' '))+'</td><td dir="ltr">'+esc(i.email)+'</td><td>'+
          (i.grants||[]).map(function(g){return esc(title(g.path))+' · '+modeName(g.mode)}).join(', ')+
          '</td><td class="acts"><button type="button" class="primary" data-mkacc="'+esc(i.email)+'" title="פותח לו חשבון עכשיו עם סיסמה זמנית 123456, עם הגישה שבעמודה גישה">פתיחת חשבון</button><button type="button" class="close" data-uninv="'+esc(i.email)+'" title="ביטול ההזמנה (התלמיד לא יקבל גישה אוטומטית)">ביטול הזמנה</button></td></tr>'}).join('')+'</tbody></table>';
    }
    return h;
  }

  // "שם: X; משפחה: Y; טלפון: Z; אימייל: W" -> fields. Email and phone are recognised by their content,
  // so a swapped label still lands in the right place; missing parts are simply left empty.
  function parseLine(t){
    var out={}, free=[];
    // Parts are separated by ; , tab, new line, or a dash with spaces around it (a phone's own dashes stay).
    t.split(/\s+[-–]\s+|[;,\t\n]+/).forEach(function(part){
      var i=part.indexOf(':'), k=i>-1?part.slice(0,i).trim():'', v=(i>-1?part.slice(i+1):part).trim();
      if(!v)return;
      var m=v.match(/[^\s<>]+@[^\s<>]+\.[^\s<>]+/);
      if(m){out.email=m[0];return}
      if(/^[+\d][\d\s\-()]{5,}$/.test(v)){out.phone=v;return}
      if(/משפחה/.test(k))out.last=v;
      else if(/שם|פרטי/.test(k))out.first=v;
      else if(/הערה/.test(k))out.note=v;
      else free.push(v);
    });
    // Unlabelled words fill first name, then family name, then the note.
    free.forEach(function(v){ if(out.first==null)out.first=v; else if(out.last==null)out.last=v; else out.note=(out.note?out.note+' ':'')+v });
    return out;
  }
  app.addEventListener('input',function(e){
    if(e.target.name!=='paste')return;
    var f=e.target.form, d=parseLine(e.target.value);
    ['first','last','phone','email','note'].forEach(function(k){if(d[k]!=null)f[k].value=d[k]});
  });

  app.addEventListener('submit',async function(e){
    if(e.target.id!=='inv')return;
    e.preventDefault();var f=e.target,b=f.querySelector('.primary');b.disabled=true;
    var email=f.email.value.trim().toLowerCase(), pw=f.pw.value;
    var r=await sb.rpc('admin_create_user',{p_email:email,p_password:pw,p_first:f.first.value.trim(),p_last:f.last.value.trim()||null,
      p_phone:f.phone.value.trim()||null,p_note:f.note.value.trim()||null,p_path:f.path.value,p_mode:f.mode.value});
    var m=document.getElementById('invmsg');
    if(r.error){m.textContent=/admin_create_user/.test(r.error.message)?'צריך קודם להריץ ב־Supabase את הקוד של הוספת תלמידים (ראה בשיחה עם Claude).':r.error.message;m.classList.add('err');b.disabled=false;return}
    await load();
    var m2=document.getElementById('invmsg');
    if(m2)m2.textContent='נוסף ✓ שלח לו: כתובת '+location.origin+'/login/ · מייל '+email+' · סיסמה '+pw;
  });

  app.addEventListener('click',async function(e){
    if(e.target.closest('[data-selall]')){(window.__users||[]).forEach(function(u){sel.add(u.id)});document.querySelectorAll('[data-sel]').forEach(function(c){c.checked=true;c.closest('.user').classList.add('sel')});selBar();return}
    if(e.target.closest('[data-goinv]')){var t=document.getElementById('addst');if(t){t.scrollIntoView({behavior:'smooth',block:'start'});var f=document.querySelector('#inv [name=first]');if(f)setTimeout(function(){f.focus({preventScroll:true})},500)}return}
    var gc=e.target.closest('[data-gid]');
    if(gc){var g=(window.__grants||[]).find(function(x){return String(x.id)===gc.getAttribute('data-gid')}), u=(window.__users||[]).find(function(x){return x.id===g.user_id});
      gmenu(g,u?uname(u):'');return}
    var tg=e.target.closest('[data-toggle]'), un=e.target.closest('[data-uninv]'), rq=e.target.closest('[data-rq]'), wk=e.target.closest('[data-week]');
    if(rq){
      rq.disabled=true;
      var q=(await sb.from('access_requests').select('*').eq('id',rq.getAttribute('data-rq')).single()).data, ok=rq.hasAttribute('data-ok'), r1={};
      if(ok) r1=await openFor(q.user_id,q.path);
      if(r1.error){alert(r1.error.message);rq.disabled=false;return}
      var r2=await sb.from('access_requests').update({handled_at:new Date().toISOString(),approved:ok}).eq('id',q.id);
      if(r2.error)alert(r2.error.message);load();return;
    }
    if(wk){
      wk.disabled=true;
      var uid2=wk.closest('[data-u]').getAttribute('data-u'), r3=await openFor(uid2,wk.getAttribute('data-week'));
      if(r3.error){alert(/expires_at/.test(r3.error.message)?'צריך קודם להריץ ב־Supabase את supabase/v4.sql.':r3.error.message);wk.disabled=false;return}
      // A request that was waiting is answered by this too.
      await sb.from('access_requests').update({handled_at:new Date().toISOString(),approved:true}).eq('user_id',uid2).eq('path',wk.getAttribute('data-week')).is('handled_at',null);
      load();return;
    }
    if(tg){
      var card=tg.closest('[data-u]'), uid=card.getAttribute('data-u'), r;tg.disabled=true;
      if(tg.getAttribute('data-toggle')==='close'&&!confirm('לסגור את כל הגישה של '+card.querySelector('h3').firstChild.textContent+'? אפשר לפתוח שוב אחר כך.')){tg.disabled=false;return}
      if(tg.getAttribute('data-toggle')==='open') r=await sb.from('grants').upsert({user_id:uid,path:card.querySelector('[data-path]').value,mode:card.querySelector('[data-mode]').value},{onConflict:'user_id,path'});
      else r=await sb.from('grants').delete().eq('user_id',uid);
      if(r.error)alert(r.error.message);load();return;
    }
    var mk=e.target.closest('[data-mkacc]');
    if(mk){
      var inv=(window.__invites||[]).find(function(i){return i.email===mk.getAttribute('data-mkacc')})||{}, g=(inv.grants||[])[0]||{};
      mk.disabled=true;
      var r=await sb.rpc('admin_create_user',{p_email:inv.email,p_password:'123456',p_first:inv.first_name||null,p_last:inv.last_name||null,
        p_phone:inv.phone||null,p_note:inv.note||null,p_path:g.path||null,p_mode:g.mode||null});
      if(r.error){alert(/admin_create_user/.test(r.error.message)?'צריך קודם להריץ ב־Supabase את הקוד של הוספת תלמידים (v3).':r.error.message);mk.disabled=false;return}
      alert('נפתח חשבון ✓\nשלח לו: '+location.origin+'/login/\nמייל: '+inv.email+'\nסיסמה: 123456 (יחליף בכניסה הראשונה)');
      load();return;
    }
    if(un&&!confirm('לבטל את ההזמנה של '+un.getAttribute('data-uninv')+'?'))return;
    if(un){un.disabled=true;var r=await sb.from('invites').delete().eq('email',un.getAttribute('data-uninv'));if(r.error)alert(r.error.message);load()}
  });
  load();
})();
</script>
</body></html>
