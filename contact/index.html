<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>צור קשר · הלכה בבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css?v=3d2b8822">
<style>main.gate-wait{visibility:hidden}
/* Contact rows (Natan, 2026-11-15): big icon on the right, the text to its left; WhatsApp round, the rest rounded squares. */
.c-row{display:grid;grid-template-columns:1fr 52px;gap:4px 14px;align-items:center;padding:14px 16px}
.c-row .tile{grid-column:2;grid-row:1/3;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;color:#fff}
.c-row .tile.round{border-radius:50%}
.c-row .tile.phone,.c-row .tile.mail{background:#2d6a4f}.c-row .tile.wa{background:#25d366}.c-row .tile.sms{background:#0a84ff}.c-row .tile.addr{background:#6b7f73}
.c-row h3{grid-column:1;grid-row:1;font-size:1.1rem;margin:0;text-align:right}
.c-row p{grid-column:1;grid-row:2;margin:0;text-align:right;white-space:pre-line}
.c-row .go{display:none}</style>
</head><body>
<main dir="rtl" lang="he" class="home gate-wait">
  <header>
    <a class="back" href="/">→ חזרה לדף הבית</a>
    <h1>צור קשר</h1>
  </header>

  <section aria-label="דרכי התקשרות">
    <ul class="topics" id="ways"></ul>
    <p class="msg" id="ways-msg" hidden>פרטי ההתקשרות יתווספו כאן בקרוב. בינתיים אפשר לכתוב למטה.</p>

    <h2 id="write-h" style="margin-top:28px">או לכתוב כאן</h2>
    <div class="cbox" id="write" role="group" aria-labelledby="write-h">
      <textarea name="body" rows="3" placeholder="ההודעה שלך" aria-label="ההודעה שלך" maxlength="4000"></textarea>
      <button type="button" class="primary" data-send disabled>שליחה</button>
      <p class="msg" role="status"></p>
    </div>
  </section>

  <footer>
    <span>נבנה בהדרגה, צעד אחר צעד.</span>
    <button id="theme" type="button">מצב כהה</button>
  </footer>
</main>
<script src="/site.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/auth.js"></script>
<script src="/contact.js"></script>
<script>
// The contact page is for signed-in readers only (Natan, 2026-11-15). Guests go to sign-in; they write from the home page.
// The details themselves live in the private settings table (supabase/v14.sql), not in this public file.
(function(){
  var main=document.querySelector('main');
  if(!window.SITE){location.replace('/');return}
  SITE.ready.then(async function(st){
    if(!st.user){location.replace('/login/?next='+encodeURIComponent(location.pathname));return}
    var r=await SITE.sb.rpc('contact_info').then(function(x){return x},function(){return {data:null}});
    var c=(r&&r.data)||{}, esc=CONTACT.esc, h='';
    function digits(t){return String(t||'').replace(/[^0-9+]/g,'')}
    function intl(t){var d=digits(t).replace(/^\+/,'');return d.charAt(0)==='0'?'972'+d.slice(1):d}
    var G='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">';
    var PH='<path d="M8.5 7.5c.3-.6.9-.9 1.5-.7l1.6.6c.6.2.9.9.7 1.5l-.6 1.4c1.1 2.2 2.6 3.7 4.8 4.8l1.4-.6c.6-.2 1.3.1 1.5.7l.6 1.6c.2.6-.1 1.2-.7 1.5-1 .5-2.2.6-3.4.2-4.3-1.4-7.6-4.7-9-9-.4-1.2-.3-2.4.2-3.4z"/>';
    var BUB='<path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>';
    var ICONS={
      phone:G+PH+'</svg>',
      wa:G+'<g transform="translate(3 2.5) scale(.8)">'+'<path d="M12 2.2a9.8 9.8 0 0 0-8.5 14.7L2 22l5.2-1.4A9.8 9.8 0 1 0 12 2.2z"/>'+'<path d="M8.6 7.9c.2-.5.6-.6.9-.6h.6c.2 0 .4 0 .5.4l.7 1.6c.1.3 0 .5-.2.7l-.4.5c.6 1.1 1.5 2 2.6 2.6l.5-.4c.2-.2.4-.3.7-.2l1.6.7c.3.1.4.3.4.5v.6c0 .3-.1.7-.6.9-.6.3-1.5.4-2.5-.1-1.6-.8-3-2.2-3.9-3.9-.4-1-.2-1.8.1-2.4z"/></g></svg>',
      sms:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">'+BUB+'<text x="12" y="13.6" text-anchor="middle" font-size="5.2" font-family="Arial" font-weight="700" fill="#fff" stroke="none">SMS</text></svg>',
      mail:G+'<circle cx="12" cy="12" r="3.2"/><path d="M15.2 12v1.4a2.3 2.3 0 0 0 4.6 0V12a7.8 7.8 0 1 0-3.1 6.2"/></svg>',
      addr:G+'<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>'
    };
    function row(kind,t,v,href){h+='<li><a class="topic c-row" href="'+esc(href)+'"'+(/^https:/.test(href)?' target="_blank" rel="noopener"':'')+'><span class="tile '+(kind==='wa'?'wa round':kind)+'" aria-hidden="true">'+ICONS[kind]+'</span><h3>'+t+'</h3><p>'+v+'</p></a></li>'}
    if(c.phone)row('phone','טלפון','<bdi dir="ltr">'+esc(c.phone)+'</bdi> · לחיצה מחייגת','tel:'+digits(c.phone));
    if(c.whatsapp||c.phone)row('wa','וואטסאפ','לחיצה פותחת שיחה','https://wa.me/'+intl(c.whatsapp||c.phone)+'?text='+encodeURIComponent('שלום, אני פונה מהאתר הלכה בבית'));
    if(c.sms||c.phone)row('sms','הודעת SMS','לחיצה פותחת הודעה חדשה','sms:'+digits(c.sms||c.phone));
    if(c.email)row('mail','אימייל','<bdi dir="ltr">'+esc(c.email)+'</bdi>','mailto:'+c.email);
    if(c.address)row('addr','כתובת המשרד',esc(c.address)+' · ניווט'+(c.hours?'\nשעות קבלה: '+esc(c.hours):''),'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address));
    document.getElementById('ways').innerHTML=h;
    if(!h)document.getElementById('ways-msg').hidden=false;
    CONTACT.wire(document.getElementById('write'),false);
    main.classList.remove('gate-wait');
  });
})();
</script>
</body></html>
