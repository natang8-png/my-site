<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>הלכה בבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head><body>
<main dir="rtl" lang="he" class="home">
  <header>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>הלכה בבית</div>
    <h1>לומדים הלכה, <em>צעד אחר צעד.</em></h1>
  </header>

  <section aria-labelledby="topics-h">
    <h2 id="topics-h">שערים</h2>
    <ul class="topics">
      <li><a class="topic" href="/halacha/" data-gate='[["halacha/family/harchakot","הרחקות"],["halacha/family/yoledet","מעגל החיים"]]'><h3>שער הלכה</h3><p class="gate-list" hidden></p><span class="go" aria-hidden="true">←</span></a></li>
      <li><a class="topic" href="/hadracha/" data-gate='[["leil-hachatuna","סדר ליל החתונה"]]'><h3>שער הדרכה</h3><p class="gate-list" hidden></p><span class="go" aria-hidden="true">←</span></a></li>
      <li><div class="topic soon"><h3>שער שלום בית</h3></div></li>
      <li><div class="topic soon"><h3>צור קשר</h3></div></li>
    </ul>
  </section>

  <footer>
    <span>נבנה בהדרגה, צעד אחר צעד.</span>
    <button id="theme" type="button">מצב כהה</button>
  </footer>
</main>
<script src="/site.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/auth.js"></script>
<script>
// Each gate (שער) on the home page (Natan, 2026-11-12): a signed-in reader sees the list of its מדורים that are open to them.
// With none open, the gate shows its name only, in the "not available" color (still a link, so a closed מדור can be requested).
(function(){
  if(!window.SITE)return;
  SITE.ready.then(function(st){
    if(!st.user)return;
    [].forEach.call(document.querySelectorAll('[data-gate]'),function(a){
      var open=JSON.parse(a.getAttribute('data-gate')).filter(function(m){return SITE.access(m[0])}).map(function(m){return m[1]});
      var p=a.querySelector('.gate-list');
      if(open.length){p.textContent=open.join(' · ');p.hidden=false}
      else a.classList.add('off');
    });
  });
})();
</script>
</body></html>
