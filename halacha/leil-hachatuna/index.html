<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>סדר ליל החתונה · הלכה</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head><body>
<main dir="rtl" lang="he" data-path="leil-hachatuna">
  <header>
    <a class="back" href="/halacha/">→ חזרה להלכה</a>
    <div class="eyebrow">הלכה · פרק 3 מתוך 3</div>
    <h1>סדר ליל החתונה</h1>
    <p class="until" id="until" hidden></p>
  </header>

  <div id="gate"><p class="msg">טוען…</p></div>

  <section class="content" id="text" hidden>
    <p class="placeholder">התוכן של הפרק הזה ייכתב כאן בהדרגה.</p>
  </section>

  <nav class="pager" aria-label="ניווט בין פרקים">
    <a class="pn prev" href="/halacha/tumat-betulim/"><small>הקודם</small>טומאת בתולים</a>
  </nav>

  <footer>
    <span>נבנה בהדרגה, צעד אחר צעד.</span>
    <button id="theme" type="button">מצב כהה</button>
  </footer>
</main>
<script src="/site.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/auth.js"></script>
<script src="/private.js"></script>
<script>
(async function(){
  var gate=document.getElementById('gate');
  if(!await LOCK.paint(gate,'leil-hachatuna')) return;
  gate.remove();
  document.getElementById('text').hidden=false;
  var g=LOCK.grantOf('leil-hachatuna'), u=document.getElementById('until');
  if(g&&g.expires_at&&!SITE.state.profile.is_admin){u.textContent='הפרק פתוח לך עד '+LOCK.day(g.expires_at)+'.';u.hidden=false}
})();
</script>
</body></html>
