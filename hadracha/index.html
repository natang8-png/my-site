<script>
// Quiz score under each chapter: questions answered out of all, and the score in percent. Resetting lives in /me/ and /admin/ only.
(function(){
  if(!window.SITE)return;
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  SITE.ready.then(function(st){
    [].forEach.call(document.querySelectorAll('[data-qsum]'),async function(box){
      var ch=box.getAttribute('data-qsum'), a=SITE.access(box.getAttribute('data-path'));
      if(a!=='study'&&a!=='quiz')return;
      var data=await fetch(box.getAttribute('data-quiz')).then(function(r){return r.json()}).catch(function(){return null});
      if(!data)return;
      var all=0;Object.keys(data).forEach(function(k){all+=(data[k]||[]).length});
      var rows=[];
      if(st.user){var r=await SITE.loadQuiz(ch);rows=r?r.rows:[]}
      else try{var o=JSON.parse(localStorage.getItem('iq:'+ch))||{};if(!Array.isArray(o))rows=Object.keys(o).map(function(k){return o[k]}).filter(function(x){return x.t!=null}).map(function(x){return {score:x.s,total:x.t}})}catch(e){}
      var s=0,t=0;rows.forEach(function(x){s+=x.score;t+=x.total});
      box.innerHTML='<span>'+(box.getAttribute('data-label')?esc(box.getAttribute('data-label'))+' · ':'')+'שאלון: <b>ענית על '+t+'</b> מתוך '+all+' שאלות'+(t?' · <span class="nw">ציון <b>'+Math.round(100*s/t)+'%</b></span>':'')+'</span>'+
        '';
      box.hidden=false;
    });
  });
})();
</script>
