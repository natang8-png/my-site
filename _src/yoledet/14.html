<p><b class="hl">ג.</b> לאור הנ״ל, דעת הרבי שאין לבעל להיות נוכח בחדר הלידה או בחדר הצירים [כנראה שהאיסור הוא מהזמן שהאשה פושטת בגדיה הרגילים ומתכוננת ללדת במקומות שמחליפים את הבגדים זמן רב יחסית לפני הלידה. אך במקומות שנהוג ללבוש חלוק סמוך ממש ללידה, יתכן שהבעל צריך ללכת גם לפני החלפת הבגדים].</p>
