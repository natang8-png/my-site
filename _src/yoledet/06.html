<p><b class="hl">א.</b> יולדת או מפלת עובר בן ארבעים יום ויותר נטמאת גם אם לא ראתה דם בתהליך הלידה או ההפלה.</p>
<p>ואם הפילה נפל שגילו פחות מארבעים יום, גם אם לא היה דימום – עליה לשאול רב, כי אם יצא גוש בגודל מסוים יש לה טומאה כנדה<sup class="fn"><a href="#n1" id="r1">1</a></sup>.</p>
<ol class="notes">
<li id="n1" value="1"><p>ראה שו״ע סי׳ קצד סעיפים א-ב. <a class="nb" href="#r1" aria-label="חזרה לטקסט">↑ לטקסט</a></p></li>
</ol>
