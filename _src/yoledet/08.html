<p><b class="hl">ג.</b> כֵּיצַד סֵדֶר טָהֳרַת הַיּוֹלֶדֶת? יוֹלֶדֶת זָכָר, מוֹנָה חֲמִישָּׁה יָמִים מִתְּחִילַּת הַטּוּמְאָה וְסוֹפֶרֶת שִׁבְעָה נְקִיִּים אַחַר הַלֵּידָה וְטוֹבֶלֶת. יוֹלֶדֶת נְקֵבָה, לֹא תִּטְבּוֹל לִפְנֵי שֶׁעָבְרוּ אַרְבָּעָה-עָשָׂר יָמִים מִלֵּידָתָהּ<sup class="fn"><a href="#n3" id="r3">3</a></sup>.</p>
