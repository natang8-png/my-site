<p><b class="hl">ג.</b> כיצד סדר טהרת היולדת? יולדת זכר, מונה חמישה ימים מתחילת הטומאה וסופרת שבעה נקיים אחר הלידה וטובלת. יולדת נקבה, לא תטבול לפני שעברו ארבעה-עשר ימים מלידתה<sup class="fn"><a href="#n3" id="r3">3</a></sup>.</p>
<ol class="notes">
<li id="n3" value="3"><p>ראה שו״ע סי׳ קצד ס״א. <a class="nb" href="#r3" aria-label="חזרה לטקסט">↑ לטקסט</a></p></li>
</ol>
